# Android 多模块 Gradle 项目预设
# 适用场景：已有多个 Gradle 子模块（:app、:lib_core、:lib_router 等）的 Android 项目
# 使用方法：复制到项目根目录，按实际情况修改 gradle_modules 列表和 path

project:
  name: "MyAndroidApp"
  language: "kotlin"
  platform: "android"

harness_framework:
  schema_version: 1
  template_version: "1.5.7"
  source: "{HARNESS_TEMPLATE_REMOTE_URL}"
  source_ref: "main"
  source_commit: null
  last_upgrade: null

agent_runtime:
  enabled: true
  contract_version: "1.1.0"
  root: "harness/.local/agent-runtime"
  current_pointer: "harness/.local/agent-runtime/current/run.json"

evals:
  enabled: true
  index: "harness/evals/index.yaml"
  runtime_candidates: "harness/.local/agent-runtime/runs/{run_id}/eval-candidates.yaml"

platforms:
  android:
    path: "."
    build: "gradle assembleDebug"
    test: "gradle test"
    gradle_modules:
      - ":app"
      - ":lib_core"
      - ":lib_router"
      - ":lib_resource"

architecture:
  layers:
    - name: "ui"
      path: "**/ui/**"
      level: 0
    - name: "domain"
      path: "**/domain/**"
      level: 1
    - name: "data"
      path: "**/data/**"
      level: 2
  exclude_paths:
    - "**/build/**"
    - "**/.gradle/**"
    - "**/generated/**"
  generated_code_paths:
    - "build/generated/"
    - "**/generated/"
    - "R.java"
    - "BuildConfig.java"

quality:
  max_file_lines: 300
  max_function_lines: 50
  baseline_mode: "baseline"
  exclude_paths:
    - "**/build/**"
    - "**/.gradle/**"
    - "**/generated/**"
    - "**/node_modules/**"
  forbidden_patterns: []

validation:
  build:
    enabled: false
    # Android 项目常不通过 harness 驱动 gradle 构建；需要时改为 true 并补 command
    # command: "gradle assembleDebug"
  lint_arch:
    command: "python scripts/lint_deps.py"
    enabled: true
  test:
    enabled: false
    # 需要时改为 true 并补 command
    # command: "gradle test"
  verify:
    command: "python scripts/validate_workflow.py && python scripts/lint_template_version.py && python scripts/lint_harness_config.py && python scripts/lint_goal_contract.py && python scripts/lint_prd_review_signoff.py && python scripts/lint_memory.py && python scripts/lint_quality.py"
    enabled: true
