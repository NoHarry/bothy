# The JIT skips one lint (Kotlin UAST) method: on Apple Silicon, JDK 17 builds without JDK-8310844 (JBR 17.0.6/17.0.8)
# crash the daemon in C1 OSR ("Field too big for insn") during lintVitalAnalyzeRelease. Drop it once every JDK in use
# carries that fix.
# 4 GB: an unshrunk release of Bothy merges all its dex at once (2 GB ran out of heap).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:CompileCommand=quiet -XX:CompileCommand=exclude,org.jetbrains.uast.kotlin.FirKotlinUastResolveProviderService::resolveSyntheticJavaPropertyAccessorCall
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# The Android Agent Runtime version the demo builds against (see settings.gradle.kts for building it from source).
agentRuntimeVersion=0.4.0
