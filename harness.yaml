project:
  name: "bothy"
  language: "kotlin"
  platform: "android"

harness_framework:
  schema_version: 1
  template_version: "1.5.7"
  source: "git@github.com:NoHarry/agent-harness-template.git"
  source_ref: "main"
  source_commit: null
  last_upgrade: "2026-07-05"

harness_runtime:
  repo_role: "target"

agent_runtime:
  enabled: true
  contract_version: "1.1.0"
  root: "harness/.local/agent-runtime"
  current_pointer: "harness/.local/agent-runtime/current/run.json"

evals:
  enabled: true
  index: "harness/evals/index.yaml"
  runtime_candidates: "harness/.local/agent-runtime/runs/{run_id}/eval-candidates.yaml"

platforms:
  android:
    path: "workspace/apps/android"
    build: "./gradlew assembleDebug"
    test: "./gradlew :agent-app-protocol:test :bothy-protocol:test :agent-app-server:testDebugUnitTest :bothy-server:testDebugUnitTest :bothy-app:testDebugUnitTest :bothy-voice:testDebugUnitTest :bothy-llm:testDebugUnitTest :bothy-playground:testDebugUnitTest"
    gradle_modules:
      - ":bothy-protocol"
      - ":bothy-server"
      - ":bothy-app"
      - ":bothy-voice"
      - ":bothy-llm"
      - ":bothy-playground"

doc:
  path: "doc"
  mode: "local"

workflow:
  ref_to_design_in_greenfield: false

agent_tools:
  codex:
    enabled: true
    skills_path: ".agents/skills"
  claude:
    enabled: true
    skills_path: ".claude/skills"
  opencode:
    enabled: true
    skills_path: ".opencode/skills"
  hook_bus:
    mode: "dry-run"
  skills_sync:
    mode: "source-of-truth"

validation:
  performance:
    record: "local"
  build:
    enabled: true
  lint_arch:
    command: "python scripts/lint_deps.py --warn-on-unresolved"
    enabled: true
  test:
    enabled: true
  verify:
    command: "python scripts/lint_public_hygiene.py && python scripts/validate_workflow.py && python scripts/validate_harness_sync.py && python scripts/lint_harness_config.py && python scripts/lint_goal_contract.py && python scripts/lint_prd_review_signoff.py && python scripts/lint_memory.py && python scripts/lint_quality.py && python workspace/apps/android/tools/app-server-api/api_dump.py"
    enabled: true

git_hooks:
  profile: "baseline"
  pre_commit:
    commands:
      - "python scripts/lint_public_hygiene.py"
      - "python scripts/sync_skills.py --check"
      - "python scripts/lint_agent_entrypoints.py"
      - "python scripts/lint_harness_config.py"
      - "python scripts/lint_goal_contract.py"
      - "python scripts/lint_prd_review_signoff.py"
      - "python scripts/validate_workflow.py"
      - "python scripts/validate_harness_sync.py"
      - "python scripts/lint_memory.py"
      - "python scripts/lint_deps.py --warn-on-unresolved"
      - "python scripts/lint_quality.py"
  pre_push:
    commands:
      - "python scripts/lint_public_hygiene.py"
      - "python scripts/validate.py --dry-run"

hardening_debt: []

architecture:
  layers:
    # The front ends (console, phone, overlay, settings): clients of the server through the protocol.
    - name: "bothy_app"
      path: "workspace/apps/android/bothy-app/src/main/**"
      level: 0
      import_prefix: "cc.noharry.bothy.app"
    # The smallest app on the app server (no features, generic persona): a protocol client like Bothy's screens.
    - name: "agent_app_sample"
      path: "workspace/apps/android/agent-app-sample/src/main/**"
      level: 0
      import_prefix: "cc.noharry.agent.appserver.sample"
    # Bothy's server: the app server with Bothy's features (voice, on-device model, checks, Playground, its settings);
    # imports nothing of the front ends.
    - name: "bothy_server"
      path: "workspace/apps/android/bothy-server/src/main/**"
      level: 1
      import_prefix: "cc.noharry.bothy.server"
    # The generic app server: runtime, sessions, models, MCP, plans, A2A, memory; imports nothing of Bothy's features
    # or of any front end.
    - name: "agent_app_server"
      path: "workspace/apps/android/agent-app-server/src/main/**"
      level: 2
      import_prefix: "cc.noharry.agent.appserver"
    # Bothy's part of the protocol (voice, checks, on-device model, companion, connectors): imports neither side.
    - name: "bothy_protocol"
      path: "workspace/apps/android/bothy-protocol/src/main/**"
      level: 3
      import_prefix: "cc.noharry.bothy.protocol"
    # The app server's protocol: plain Kotlin, imports nothing of any app, server or front end.
    - name: "agent_app_protocol"
      path: "workspace/apps/android/agent-app-protocol/src/main/**"
      level: 4
      import_prefix: "cc.noharry.agent.appserver.protocol"
  # The generic layer imports nothing of Bothy (CONSTRAINTS L1); levels alone would let agent-app-server import
  # bothy-protocol, and bothy-voice / bothy-llm are no layers.
  isolation:
    - import_prefix: "cc.noharry.bothy"
      allowed_paths:
        - "workspace/apps/android/bothy-*/**"
      note: "agent-app-server, agent-app-protocol and agent-app-sample stay generic; a host gives Bothy's parts through AppServerConfig."
  exclude_paths:
    - ".agent-harness/**"
    - ".agents/**"
    - ".claude/**"
    - ".githooks/**"
    - ".opencode/**"
    - ".review/**"
    - "doc/**"
    - "harness/**"
    - "scripts/**"
    - "templates/**"
    - "**/build/**"
    - "**/.gradle/**"
    - "**/generated/**"
    - "**/gradle/wrapper/**"
  generated_code_paths:
    - "build/generated/"
    - "**/generated/"
    - "R.java"
    - "BuildConfig.java"

quality:
  max_file_lines: 1000
  max_function_lines: 50
  baseline_mode: "off"
  exclude_paths:
    - "**/build/**"
    - "**/.gradle/**"
    - "**/generated/**"
    - "**/gradle/wrapper/**"
    - "**/node_modules/**"
    # The protocol's JSON Schema and TypeScript types, generated by ./gradlew :bothy-protocol:generateSchema.
    - "workspace/apps/android/bothy-protocol/schema/**"
  forbidden_patterns:
    - pattern: "System\\.out\\.println"
      message: "Use a structured logger or trace event instead of stdout."
      languages: ["kotlin", "java"]
