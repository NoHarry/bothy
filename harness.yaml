project:
  name: "bothy"
  language: "kotlin"
  platform: "android"

harness_framework:
  schema_version: 1
  template_version: "1.5.7"
  source: "git@github.com:NoHarry/agent-harness-template.git"
  source_ref: "main"
  source_commit: null
  last_upgrade: "2026-07-05"

harness_runtime:
  repo_role: "target"

agent_runtime:
  enabled: true
  contract_version: "1.1.0"
  root: "harness/.local/agent-runtime"
  current_pointer: "harness/.local/agent-runtime/current/run.json"

evals:
  enabled: true
  index: "harness/evals/index.yaml"
  runtime_candidates: "harness/.local/agent-runtime/runs/{run_id}/eval-candidates.yaml"

platforms:
  android:
    path: "workspace/apps/android"
    build: "./gradlew assembleDebug"
    test: "./gradlew :bothy-protocol:test :bothy-server:testDebugUnitTest :bothy-app:testDebugUnitTest :bothy-voice:testDebugUnitTest :bothy-llm:testDebugUnitTest :bothy-playground:testDebugUnitTest :agent-app-cards:testDebugUnitTest :agent-app-pages:testDebugUnitTest :agent-app-memory:testDebugUnitTest :agent-app-images:testDebugUnitTest :agent-app-plans:testDebugUnitTest :agent-app-a2a:testDebugUnitTest :agent-app-cards:apiCheck :agent-app-pages:apiCheck :agent-app-memory:apiCheck :agent-app-images:apiCheck :agent-app-plans:apiCheck :agent-app-a2a:apiCheck checkPluginsStandAlone"
    gradle_modules:
      - ":bothy-protocol"
      - ":bothy-server"
      - ":bothy-app"
      - ":bothy-voice"
      - ":bothy-llm"
      - ":bothy-playground"

doc:
  path: "doc"
  mode: "local"

workflow:
  ref_to_design_in_greenfield: false

agent_tools:
  codex:
    enabled: true
    skills_path: ".agents/skills"
  claude:
    enabled: true
    skills_path: ".claude/skills"
  opencode:
    enabled: true
    skills_path: ".opencode/skills"
  hook_bus:
    mode: "dry-run"
  skills_sync:
    mode: "source-of-truth"

validation:
  performance:
    record: "local"
  build:
    enabled: true
  lint_arch:
    command: "python scripts/lint_deps.py --warn-on-unresolved"
    enabled: true
  test:
    enabled: true
  verify:
    command: "python scripts/lint_public_hygiene.py && python scripts/validate_workflow.py && python scripts/validate_harness_sync.py && python scripts/lint_harness_config.py && python scripts/lint_goal_contract.py && python scripts/lint_prd_review_signoff.py && python scripts/lint_memory.py && python scripts/lint_quality.py"
    enabled: true

git_hooks:
  profile: "baseline"
  pre_commit:
    commands:
      - "python scripts/lint_public_hygiene.py"
      - "python scripts/sync_skills.py --check"
      - "python scripts/lint_agent_entrypoints.py"
      - "python scripts/lint_harness_config.py"
      - "python scripts/lint_goal_contract.py"
      - "python scripts/lint_prd_review_signoff.py"
      - "python scripts/validate_workflow.py"
      - "python scripts/validate_harness_sync.py"
      - "python scripts/lint_memory.py"
      - "python scripts/lint_deps.py --warn-on-unresolved"
      - "python scripts/lint_quality.py"
  pre_push:
    commands:
      - "python scripts/lint_public_hygiene.py"
      # The full run (about a minute): a dry run only lists the commands and proves nothing about what is pushed.
      - "python scripts/validate.py"

hardening_debt: []

architecture:
  layers:
    # The front ends (console, phone, overlay, settings): clients of the server through the protocol.
    - name: "bothy_app"
      path: "workspace/apps/android/bothy-app/src/main/**"
      level: 0
      import_prefix: "cc.noharry.bothy.app"
    # Bothy's server: the runtime's app server (cc.noharry:agent-app-server, in the runtime's repository) with Bothy's
    # features (voice, on-device model, checks, Playground, its settings); imports nothing of the front ends.
    - name: "bothy_server"
      path: "workspace/apps/android/bothy-server/src/main/**"
      level: 1
      import_prefix: "cc.noharry.bothy.server"
    # Bothy's part of the protocol (voice, checks, on-device model, companion, connectors), on the app server's protocol:
    # imports neither side.
    - name: "bothy_protocol"
      path: "workspace/apps/android/bothy-protocol/src/main/**"
      level: 3
      import_prefix: "cc.noharry.bothy.protocol"
  # The app server and its protocol are the runtime's (its repository checks their layering). The first-party plugins
  # are source modules here (workspace/apps/android/plugins/), which name nothing of Bothy and depend on no Bothy module
  # (checkPluginsStandAlone), so the directory can be a repository of its own. bothy-voice, bothy-llm and
  # bothy-playground are no layers, and only Bothy's modules name Bothy's packages.
  isolation:
    - import_prefix: "cc.noharry.bothy"
      allowed_paths:
        - "workspace/apps/android/bothy-*/**"
      note: "Only Bothy's own modules name Bothy's packages; the plugins in plugins/ never do."
    # A plugin is known only to itself and to the hosts that list it (Bothy's server and screens): no plugin names
    # another's package. The model services (DeepSeek's extras among them) are the runtime's agent-app-models, which
    # Bothy's server depends on; its requests are the app server's own protocol (services/*).
    - import_prefix: "cc.noharry.agent.appserver.models"
      allowed_paths:
        - "workspace/apps/android/bothy-*/**"
      note: "The model services come with the runtime's agent-app-models (ModelsPlugin, loaded from its manifest)."
    - import_prefix: "cc.noharry.agent.appserver.a2ui"
      allowed_paths:
        - "workspace/apps/android/plugins/agent-app-cards/**"
        - "workspace/apps/android/bothy-*/**"
      note: "Cards and offers come with CardsPlugin."
    # Operating the screen and the device's tools, their plugins included, are the runtime's agent-android-use and
    # agent-device-capabilities, loaded from their manifests: no plugin here names them.
    - import_prefix: "cc.noharry.agent.androiduse"
      allowed_paths:
        - "workspace/apps/android/bothy-*/**"
      note: "Operating the screen comes with the runtime's agent-android-use (AndroidUsePlugin, loaded from its manifest)."
    - import_prefix: "cc.noharry.agent.device"
      allowed_paths:
        - "workspace/apps/android/bothy-*/**"
      note: "The device's tools come with the runtime's agent-device-capabilities (DeviceToolsPlugin, loaded from its manifest)."
    - import_prefix: "cc.noharry.agent.appserver.pages"
      allowed_paths:
        - "workspace/apps/android/plugins/agent-app-pages/**"
        - "workspace/apps/android/bothy-*/**"
      note: "Drawn pages come with PagesPlugin."
    - import_prefix: "cc.noharry.agent.appserver.memory"
      allowed_paths:
        - "workspace/apps/android/plugins/agent-app-memory/**"
        - "workspace/apps/android/bothy-*/**"
      note: "What is remembered about the person comes with MemoryPlugin."
    - import_prefix: "cc.noharry.agent.appserver.image"
      allowed_paths:
        - "workspace/apps/android/plugins/agent-app-images/**"
        - "workspace/apps/android/bothy-*/**"
      note: "The image model and its tool come with ImagesPlugin."
    - import_prefix: "cc.noharry.agent.appserver.plans"
      allowed_paths:
        - "workspace/apps/android/plugins/agent-app-plans/**"
        - "workspace/apps/android/bothy-*/**"
      note: "Plans come with PlansPlugin; plans and A2A know nothing of each other."
    - import_prefix: "cc.noharry.agent.appserver.a2a"
      allowed_paths:
        - "workspace/apps/android/plugins/agent-app-a2a/**"
        - "workspace/apps/android/bothy-*/**"
      note: "A2A comes with A2aPlugin."
    - import_prefix: "cc.noharry.agent.a2a"
      allowed_paths:
        - "workspace/apps/android/plugins/agent-app-a2a/**"
        - "workspace/apps/android/bothy-*/**"
      note: "Only the A2A plugin (and Bothy) use the runtime's agent-a2a (its direct and official clients)."
  exclude_paths:
    - ".agent-harness/**"
    - ".agents/**"
    - ".claude/**"
    - ".githooks/**"
    - ".opencode/**"
    - ".review/**"
    - "doc/**"
    - "harness/**"
    - "scripts/**"
    - "templates/**"
    - "**/build/**"
    - "**/.gradle/**"
    - "**/generated/**"
    - "**/gradle/wrapper/**"
  generated_code_paths:
    - "build/generated/"
    - "**/generated/"
    - "R.java"
    - "BuildConfig.java"

quality:
  max_file_lines: 1000
  max_function_lines: 50
  baseline_mode: "off"
  exclude_paths:
    - "**/build/**"
    - "**/.gradle/**"
    - "**/generated/**"
    - "**/gradle/wrapper/**"
    - "**/node_modules/**"
    # The protocol's JSON Schema and TypeScript types, generated by ./gradlew :bothy-protocol:generateSchema.
    - "workspace/apps/android/bothy-protocol/schema/**"
  forbidden_patterns:
    - pattern: "System\\.out\\.println"
      message: "Use a structured logger or trace event instead of stdout."
      languages: ["kotlin", "java"]
